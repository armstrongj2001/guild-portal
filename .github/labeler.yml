# A contribution that only adds to the fork surface is auto-mergeable.
# Anything touching shared code routes to manual review.
auto-mergeable:
  - all:
      - changed-files:
          - any-glob-to-all-files:
              - members.json
              - notes/**
              - src/renderers/**
              - src/themes/**

renderer:
  - changed-files:
      - any-glob-to-any-file: src/renderers/**

theme:
  - changed-files:
      - any-glob-to-any-file: src/themes/**

ship-note:
  - changed-files:
      - any-glob-to-any-file: notes/**

new-member:
  - changed-files:
      - any-glob-to-any-file: members.json
